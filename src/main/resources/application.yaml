spring:
  application:
    name: automated-git-diff-notes-generator
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    ollama:
      chat:
        model: qwen3:8b
        temperature: 0.3
        think: false
github:
  api:
    token: ${GITHUB_PAT_TOKEN}
  webhook:
    secret: ${WEBHOOK_SECRET}