spring:
  application:
    name: automated-git-diff-notes-generator
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
github:
  api:
    token: ${GITHUB_PAT_TOKEN}
  webhook:
    secret: ${WEBHOOK_SECRET}
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: git-diff-notes-generator
    access-token-ttl: 1h
  release-notes:
    claim-stale-after: 15m